<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-image {
            width: 300px;
            height: 200px;
            margin: 10px;
            border: 2px solid #ccc;
            object-fit: cover;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Image Loading Test</h1>
    <p>Testing if images can be loaded from the /images/ folder:</p>
    
    <div id="results"></div>
    
    <script>
        const testImages = [
            '/images/724-10.JPG',
            '/images/724-56.JPG',
            '/images/724-62.JPG',
            '/images/724-70.JPG',
            '/images/84190002.JPG',
            '/images/84190003.JPG'
        ];
        
        const resultsDiv = document.getElementById('results');
        
        testImages.forEach((src, index) => {
            const container = document.createElement('div');
            container.style.margin = '20px 0';
            container.style.padding = '10px';
            container.style.border = '1px solid #ddd';
            container.style.borderRadius = '5px';
            
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = `Testing: ${src}`;
            
            const img = document.createElement('img');
            img.className = 'test-image';
            img.src = src;
            img.alt = `Test ${index + 1}`;
            
            img.onload = () => {
                status.className = 'status success';
                status.textContent = `✅ SUCCESS: ${src} loaded successfully`;
                console.log(`Image loaded: ${src}`);
            };
            
            img.onerror = () => {
                status.className = 'status error';
                status.textContent = `❌ ERROR: ${src} failed to load`;
                console.error(`Image failed: ${src}`);
            };
            
            container.appendChild(status);
            container.appendChild(img);
            resultsDiv.appendChild(container);
        });
        
        // Also test with relative paths
        console.log('Testing with relative paths...');
        const relativeTestImages = [
            'images/724-10.JPG',
            'images/724-56.JPG',
            'images/724-62.JPG'
        ];
        
        relativeTestImages.forEach((src, index) => {
            const container = document.createElement('div');
            container.style.margin = '20px 0';
            container.style.padding = '10px';
            container.style.border = '1px solid #ddd';
            container.style.borderRadius = '5px';
            
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = `Testing relative: ${src}`;
            
            const img = document.createElement('img');
            img.className = 'test-image';
            img.src = src;
            img.alt = `Relative Test ${index + 1}`;
            
            img.onload = () => {
                status.className = 'status success';
                status.textContent = `✅ SUCCESS: ${src} loaded successfully (relative path)`;
                console.log(`Relative image loaded: ${src}`);
            };
            
            img.onerror = () => {
                status.className = 'status error';
                status.textContent = `❌ ERROR: ${src} failed to load (relative path)`;
                console.error(`Relative image failed: ${src}`);
            };
            
            container.appendChild(status);
            container.appendChild(img);
            resultsDiv.appendChild(container);
        });
    </script>
</body>
</html>
