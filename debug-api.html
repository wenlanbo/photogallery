<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debug</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .api-test {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #0f0f0f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px 10px 0;
        }
        button:hover {
            background: #333;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            color: #2e7d32;
            background: #e8f5e8;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>API Debug Tool</h1>
    
    <div class="api-test">
        <h2>Test Photos API</h2>
        <button onclick="testPhotosAPI()">Test /api/photos?folder=new-day-one</button>
        <button onclick="testPhotosAPINoFolder()">Test /api/photos (no folder)</button>
        <div id="photosResult" class="result"></div>
    </div>
    
    <div class="api-test">
        <h2>Test Cover Search API</h2>
        <button onclick="testCoverSearch()">Test /api/search-covers</button>
        <div id="coversResult" class="result"></div>
    </div>
    
    <div class="api-test">
        <h2>Test Health API</h2>
        <button onclick="testHealthAPI()">Test /api/health</button>
        <div id="healthResult" class="result"></div>
    </div>

    <script>
        async function testAPI(url, resultId) {
            const resultDiv = document.getElementById(resultId);
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                resultDiv.innerHTML = `
Status: ${response.status} ${response.statusText}
URL: ${url}
Data: ${JSON.stringify(data, null, 2)}
                `;
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.innerHTML = `Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
        
        function testPhotosAPI() {
            testAPI('/api/photos?folder=new-day-one&limit=100', 'photosResult');
        }
        
        function testPhotosAPINoFolder() {
            testAPI('/api/photos?limit=10', 'photosResult');
        }
        
        function testCoverSearch() {
            testAPI('/api/search-covers', 'coversResult');
        }
        
        function testHealthAPI() {
            testAPI('/api/health', 'healthResult');
        }
        
        // Auto-run tests on page load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                testHealthAPI();
                setTimeout(() => testCoverSearch(), 1000);
                setTimeout(() => testPhotosAPI(), 2000);
            }, 500);
        });
    </script>
</body>
</html>
