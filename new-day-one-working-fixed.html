<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Day One - Working Fixed</title>
    <link rel="icon" type="image/png" href="icons/wenlanbo.png">
    <link rel="shortcut icon" type="image/png" href="icons/wenlanbo.png">
    <link rel="apple-touch-icon" href="icons/wenlanbo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', sans-serif;
            line-height: 1.5;
            color: #1a1a1a;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: #fafafa;
            padding: 2.5rem 0;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 500;
            color: #0f0f0f;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666666;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .main {
            padding: 2rem 0;
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-deck {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            opacity: 0;
            transform: translateX(100%) rotateY(10deg);
        }

        .card.active {
            opacity: 1;
            transform: translateX(0) rotateY(0deg);
            z-index: 10;
        }

        .card.prev {
            opacity: 0.3;
            transform: translateX(-100%) rotateY(-10deg);
            z-index: 5;
        }

        .card.next {
            opacity: 0.3;
            transform: translateX(100%) rotateY(10deg);
            z-index: 5;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.02);
        }

        .navigation {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 2rem;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .nav-btn {
            background: #0f0f0f;
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #333333;
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .counter {
            font-size: 0.9rem;
            color: #666666;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            min-width: 80px;
            text-align: center;
        }

        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            color: #666666;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 1);
            color: #0f0f0f;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #0f0f0f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
            padding: 1.5rem 0;
            text-align: center;
            margin-top: auto;
        }

        .copyright {
            font-size: 0.85rem;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin: 0;
        }

        .debug {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            max-width: 300px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="title">New Day One</h1>
            <p class="subtitle">Working Fixed Version</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="card-deck" id="cardDeck">
                <!-- Cards will be created here -->
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading slideshow...</p>
            </div>
        </div>
    </main>

    <!-- Navigation controls -->
    <div class="navigation" id="navigation">
        <button class="nav-btn prev-btn" id="prevBtn">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="counter" id="counter">
            <span id="currentIndex">1</span> / <span id="totalCount">0</span>
        </div>
        <button class="nav-btn play-btn" id="playBtn" title="Toggle auto-play (Spacebar)">
            <i class="fas fa-play" id="playIcon"></i>
        </button>
        <button class="nav-btn next-btn" id="nextBtn">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <!-- Back to main gallery -->
    <div class="back-link">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Gallery</span>
        </a>
    </div>

    <!-- Debug info -->
    <div class="debug" id="debug">
        Loading...
    </div>

    <!-- Footer with copyright -->
    <footer class="footer">
        <div class="container">
            <p class="copyright">© 2024 Wenlanbo. All rights reserved.</p>
        </div>
    </footer>

    <script>
        class WorkingCardDeck {
            constructor() {
                this.currentIndex = 0;
                this.photos = [];
                this.autoPlayInterval = null;
                this.autoPlayDelay = 3000; // 3 seconds between slides
                
                // DOM elements
                this.cardDeck = document.getElementById('cardDeck');
                this.loading = document.getElementById('loading');
                this.navigation = document.getElementById('navigation');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.playBtn = document.getElementById('playBtn');
                this.playIcon = document.getElementById('playIcon');
                this.currentIndexSpan = document.getElementById('currentIndex');
                this.totalCountSpan = document.getElementById('totalCount');
                this.debug = document.getElementById('debug');
                
                this.init();
            }
            
            async init() {
                await this.loadPhotos();
                this.setupEventListeners();
            }
            
            async loadPhotos() {
                try {
                    console.log('Loading photos from API...');
                    this.updateDebug('Loading from API...');
                    
                    const response = await fetch('/api/photos?folder=new-day-one&limit=100');
                    console.log('API Response status:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`API failed: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('API Response data:', data);
                    
                    this.photos = data.photos || [];
                    console.log('Photos loaded from API:', this.photos.length);
                    
                    if (this.photos.length === 0) {
                        console.log('No photos from API, using placeholders...');
                        this.updateDebug('No API photos, using placeholders');
                        this.loadPlaceholderPhotos();
                        return;
                    }
                    
                    this.createCards();
                    this.showCurrentCard();
                    this.hideLoading();
                    this.updateDebug(`Loaded ${this.photos.length} photos from API`);
                    
                } catch (error) {
                    console.error('Error loading photos from API:', error);
                    console.log('Falling back to placeholder images...');
                    this.updateDebug('API failed, using placeholders');
                    this.loadPlaceholderPhotos();
                }
            }
            
            loadPlaceholderPhotos() {
                // Use the same placeholder approach as the main gallery
                this.photos = [];
                for (let i = 0; i < 10; i++) {
                    this.photos.push({
                        id: i,
                        src: `https://picsum.photos/800/600?random=${i + 100}`,
                        alt: `Placeholder Photo ${i + 1}`,
                        thumbnail: `https://picsum.photos/400/300?random=${i + 100}`
                    });
                }
                this.createCards();
                this.showCurrentCard();
                this.hideLoading();
                this.updateDebug(`Loaded ${this.photos.length} placeholder photos`);
            }
            
            createCards() {
                console.log('Creating cards for', this.photos.length, 'photos');
                this.cardDeck.innerHTML = '';
                
                this.photos.forEach((photo, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.index = index;
                    
                    const img = document.createElement('img');
                    const imageSrc = photo.src || photo.url;
                    img.src = imageSrc;
                    img.alt = photo.alt || `Photo ${index + 1}`;
                    img.loading = 'lazy';
                    
                    // Add error handling for images
                    img.onerror = () => {
                        console.error(`Failed to load image: ${imageSrc}`);
                        // Try a different placeholder if this one fails
                        img.src = `https://picsum.photos/800/600?random=${index + 200}`;
                    };
                    
                    // Add success handler
                    img.onload = () => {
                        console.log(`Image loaded successfully: ${imageSrc}`);
                    };
                    
                    card.appendChild(img);
                    this.cardDeck.appendChild(card);
                    
                    console.log(`Created card ${index + 1}:`, imageSrc);
                });
                
                this.totalCountSpan.textContent = this.photos.length;
                console.log('Cards created, total count:', this.photos.length);
            }
            
            showCurrentCard() {
                console.log('Showing current card, index:', this.currentIndex);
                const cards = this.cardDeck.querySelectorAll('.card');
                console.log('Found cards:', cards.length);
                
                cards.forEach((card, index) => {
                    card.classList.remove('active', 'prev', 'next');
                    
                    if (index === this.currentIndex) {
                        card.classList.add('active');
                        console.log('Set card', index, 'as active');
                    } else if (index === this.currentIndex - 1) {
                        card.classList.add('prev');
                        console.log('Set card', index, 'as prev');
                    } else if (index === this.currentIndex + 1) {
                        card.classList.add('next');
                        console.log('Set card', index, 'as next');
                    }
                });
                
                this.currentIndexSpan.textContent = this.currentIndex + 1;
                this.updateNavigation();
                console.log('Current card shown successfully');
            }
            
            nextCard() {
                this.currentIndex++;
                // Circulate to the beginning when reaching the end
                if (this.currentIndex >= this.photos.length) {
                    this.currentIndex = 0;
                }
                this.showCurrentCard();
            }
            
            prevCard() {
                this.currentIndex--;
                // Circulate to the end when going before the beginning
                if (this.currentIndex < 0) {
                    this.currentIndex = this.photos.length - 1;
                }
                this.showCurrentCard();
            }
            
            updateNavigation() {
                // Always enable navigation since we're circulating
                this.prevBtn.disabled = false;
                this.nextBtn.disabled = false;
            }
            
            setupEventListeners() {
                this.prevBtn.addEventListener('click', () => {
                    this.stopAutoPlay();
                    this.prevCard();
                });
                this.nextBtn.addEventListener('click', () => {
                    this.stopAutoPlay();
                    this.nextCard();
                });
                this.playBtn.addEventListener('click', () => {
                    this.toggleAutoPlay();
                });
                
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.stopAutoPlay();
                            this.prevCard();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.stopAutoPlay();
                            this.nextCard();
                            break;
                        case ' ': // Spacebar
                            e.preventDefault();
                            this.toggleAutoPlay();
                            break;
                    }
                });
                
                this.cardDeck.addEventListener('click', (e) => {
                    if (e.target.closest('.card')) {
                        this.stopAutoPlay();
                        this.nextCard();
                    }
                });
                
                // Start auto-play after a short delay
                setTimeout(() => {
                    this.startAutoPlay();
                }, 2000);
            }
            
            startAutoPlay() {
                this.stopAutoPlay(); // Clear any existing interval
                this.autoPlayInterval = setInterval(() => {
                    this.nextCard();
                }, this.autoPlayDelay);
                this.playIcon.className = 'fas fa-pause';
            }
            
            stopAutoPlay() {
                if (this.autoPlayInterval) {
                    clearInterval(this.autoPlayInterval);
                    this.autoPlayInterval = null;
                }
                this.playIcon.className = 'fas fa-play';
            }
            
            toggleAutoPlay() {
                if (this.autoPlayInterval) {
                    this.stopAutoPlay();
                    this.playIcon.className = 'fas fa-play';
                } else {
                    this.startAutoPlay();
                    this.playIcon.className = 'fas fa-pause';
                }
            }
            
            hideLoading() {
                this.loading.style.display = 'none';
                this.navigation.style.display = 'flex';
            }
            
            updateDebug(message) {
                this.debug.textContent = message;
                console.log('Debug:', message);
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new WorkingCardDeck();
        });
    </script>
</body>
</html>
