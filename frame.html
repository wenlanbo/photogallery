<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Day One - Film Experience</title>
    
    <!-- Farcaster Frame Meta Tags -->
    <meta property="fc:frame" content="vNext" />
    <meta property="fc:frame:image" content="https://w.enlan.bo/frame-og.png" />
    <meta property="fc:frame:button:1" content="View Slideshow" />
    <meta property="fc:frame:post_url" content="https://w.enlan.bo/api/frame" />
    
    <!-- Farcaster Mini App SDK -->
    <script src="https://unpkg.com/@farcaster/miniapp-sdk@0.0.7/dist/index.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: rgba(0,0,0,0.8);
            padding: 1rem;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .title {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 0.25rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            width: auto;
            height: auto;
            display: block;
            margin: 0;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(0,0,0,0.8);
            padding: 0.75rem;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .btn {
            background: rgba(255,255,255,0.9);
            border: none;
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn:hover {
            background: white;
            transform: translateY(-1px);
        }

        .counter {
            color: white;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 1.2rem;
        }

        .farcaster-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 0.5rem 1rem;
            border-radius: 15px;
            font-size: 0.8rem;
            color: #ccc;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="title">New Day One</h1>
        <p class="subtitle">A Film Experience</p>
    </header>

    <div class="farcaster-info">
        📸 Farcaster Mini App
    </div>

    <div class="slideshow-container" id="slideshow">
        <div class="loading" id="loading">Loading Film Experience...</div>
    </div>

    <script>
        // Farcaster Mini App SDK initialization
        let sdk;
        let readyCalled = false;

        async function initializeFarcasterSDK() {
            try {
                console.log('🔧 Initializing Farcaster Mini App SDK...');
                
                // Wait for SDK to be available
                await new Promise(resolve => {
                    const checkSDK = () => {
                        if (typeof window.FarcasterMiniApp !== 'undefined') {
                            resolve();
                        } else {
                            setTimeout(checkSDK, 100);
                        }
                    };
                    checkSDK();
                });

                // Initialize the SDK
                sdk = new window.FarcasterMiniApp({
                    frameUrl: window.location.href,
                    frameData: {
                        fid: 302199,
                        network: 1,
                    },
                });

                console.log('✅ Farcaster Mini App SDK initialized');
                
            } catch (error) {
                console.error('❌ Error initializing SDK:', error);
            }
        }

        async function callReady() {
            if (readyCalled) return;
            
            try {
                console.log('🚀 Calling sdk.actions.ready()...');
                
                if (sdk && sdk.actions && typeof sdk.actions.ready === 'function') {
                    await sdk.actions.ready();
                    console.log('✅ sdk.actions.ready() called successfully');
                    readyCalled = true;
                } else {
                    console.log('⚠️ SDK not available, trying alternative methods...');
                    
                    // Try alternative methods
                    if (window.farcaster && window.farcaster.ready) {
                        await window.farcaster.ready();
                        console.log('✅ window.farcaster.ready() called');
                        readyCalled = true;
                    } else if (window.parent && window.parent.postMessage) {
                        window.parent.postMessage({ type: 'ready' }, '*');
                        console.log('✅ postMessage ready sent');
                        readyCalled = true;
                    } else {
                        console.log('❌ No ready methods available');
                        readyCalled = true; // Prevent infinite retries
                    }
                }
                
            } catch (error) {
                console.error('❌ Error calling ready():', error);
                readyCalled = true; // Prevent infinite retries
            }
        }

        // Slideshow functionality
        let images = [];
        async function loadImagesFromAPI() {
            try {
                console.log('📸 Loading images from API...');
                const response = await fetch('/api/photos?folder=new-day-one&limit=50');
                
                if (!response.ok) {
                    throw new Error(`API failed: ${response.status}`);
                }
                
                const data = await response.json();
                const apiImages = data.photos || [];
                
                if (apiImages.length > 0) {
                    images = apiImages.map(photo => photo.src || photo.url);
                    console.log(`✅ Loaded ${images.length} images from API`);
                } else {
                    // Fallback to placeholder images
                    images = [
                        'https://picsum.photos/800/600?random=1',
                        'https://picsum.photos/800/600?random=2',
                        'https://picsum.photos/800/600?random=3',
                        'https://picsum.photos/800/600?random=4',
                        'https://picsum.photos/800/600?random=5',
                        'https://picsum.photos/800/600?random=6'
                    ];
                    console.log('⚠️ No API images, using placeholders');
                }
            } catch (error) {
                console.error('❌ Error loading from API:', error);
                // Fallback to placeholder images
                images = [
                    'https://picsum.photos/800/600?random=1',
                    'https://picsum.photos/800/600?random=2',
                    'https://picsum.photos/800/600?random=3',
                    'https://picsum.photos/800/600?random=4',
                    'https://picsum.photos/800/600?random=5',
                    'https://picsum.photos/800/600?random=6'
                ];
                console.log('⚠️ API failed, using placeholders');
            }
        }

        let currentSlide = 0;
        let autoPlayInterval = null;
        let slides = [];

        function createSlides() {
            console.log('🎬 Creating slides...');
            const slideshow = document.getElementById('slideshow');
            slideshow.innerHTML = '';

            images.forEach((src, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `slide${index}`;

                const img = document.createElement('img');
                img.src = src;
                img.alt = `Slide ${index + 1}`;

                img.onload = () => {
                    console.log(`✅ Image ${index + 1} loaded`);
                    
                    // Call ready() when first image loads
                    if (index === 0) {
                        console.log('🎯 First image loaded, calling ready()');
                        callReady();
                    }
                };

                img.onerror = () => {
                    console.log(`❌ Image ${index + 1} failed`);
                    
                    // Call ready() even if first image fails
                    if (index === 0) {
                        console.log('🎯 First image failed, calling ready() anyway');
                        callReady();
                    }
                };

                slide.appendChild(img);
                slideshow.appendChild(slide);
                slides.push(slide);
            });

            console.log(`✅ Created ${slides.length} slides`);
        }

        function showSlide(index) {
            console.log(`🎬 Showing slide ${index + 1}`);
            
            slides.forEach((slide, i) => {
                slide.classList.remove('active');
            });
            
            slides[index].classList.add('active');
            currentSlide = index;
            updateCounter();
        }

        function nextSlide() {
            let next = currentSlide + 1;
            if (next >= slides.length) {
                next = 0;
            }
            showSlide(next);
        }

        function prevSlide() {
            let prev = currentSlide - 1;
            if (prev < 0) {
                prev = slides.length - 1;
            }
            showSlide(prev);
        }

        function updateCounter() {
            const counter = document.querySelector('.counter');
            if (counter) {
                counter.innerHTML = `<span id="current">${currentSlide + 1}</span> / <span id="total">${slides.length}</span>`;
            }
        }

        function startAutoPlay() {
            stopAutoPlay();
            autoPlayInterval = setInterval(nextSlide, 4000);
            console.log('▶️ Auto-play started');
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        function createControls() {
            const controls = document.createElement('div');
            controls.className = 'controls';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'btn';
            prevBtn.textContent = '←';
            prevBtn.onclick = () => {
                prevSlide();
            };

            const counter = document.createElement('div');
            counter.className = 'counter';
            counter.innerHTML = '<span id="current">1</span> / <span id="total">' + slides.length + '</span>';

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn';
            nextBtn.textContent = '→';
            nextBtn.onclick = () => {
                nextSlide();
            };

            controls.appendChild(prevBtn);
            controls.appendChild(counter);
            controls.appendChild(nextBtn);

            document.body.appendChild(controls);
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Frame loaded, initializing...');
            
            try {
                // Initialize Farcaster SDK first
                await initializeFarcasterSDK();
                
                // Load images and create slideshow
                await loadImagesFromAPI();
                createSlides();
                createControls();
                showSlide(0);
                hideLoading();
                
                // Start auto-play
                startAutoPlay();
                
                // Fallback: call ready after 1 second if not called yet
                setTimeout(() => {
                    if (!readyCalled) {
                        console.log('⏰ Fallback: calling ready() after timeout');
                        callReady();
                    }
                }, 1000);
                
            } catch (error) {
                console.error('❌ Initialization error:', error);
                // Still try to call ready() even if there's an error
                callReady();
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    prevSlide();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextSlide();
                    break;
            }
        });
    </script>
</body>
</html>
