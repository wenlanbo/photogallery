<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Day One - Film Experience</title>
    
    <!-- Farcaster Mini App Meta Tags -->
    <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://w.enlan.bo/frame-og.png","button":{"title":"View Slideshow","action":{"type":"launch_frame","name":"New Day One","url":"https://w.enlan.bo/frame","splashImageUrl":"https://w.enlan.bo/app-icon.png","splashBackgroundColor":"#FFFFFF"}}}' />
    
    <!-- Farcaster Mini App SDK -->
    <script>
        // Try to load the SDK
        (async function() {
            try {
                // Method 1: Try ES6 module import
                const { sdk } = await import('https://unpkg.com/@farcaster/miniapp-sdk@latest/dist/index.js');
                window.farcasterSDK = sdk;
                console.log('✅ Farcaster SDK imported successfully via ES6:', sdk);
            } catch (error) {
                console.log('⚠️ ES6 import failed, trying alternative methods...');
                
                // Method 2: Try loading as script tag
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/@farcaster/miniapp-sdk@latest/dist/index.js';
                script.onload = function() {
                    if (window.FarcasterSDK) {
                        window.farcasterSDK = window.FarcasterSDK;
                        console.log('✅ Farcaster SDK loaded via script tag:', window.farcasterSDK);
                    }
                };
                script.onerror = function() {
                    console.log('⚠️ Script tag loading also failed');
                };
                document.head.appendChild(script);
            }
        })();
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: rgba(0,0,0,0.8);
            padding: 1rem;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .title {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 0.25rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            width: auto;
            height: auto;
            display: block;
            margin: 0;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(0,0,0,0.8);
            padding: 0.75rem;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .btn {
            background: rgba(255,255,255,0.9);
            border: none;
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn:hover {
            background: white;
            transform: translateY(-1px);
        }

        .counter {
            color: white;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 1.2rem;
        }

        .farcaster-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 0.5rem 1rem;
            border-radius: 15px;
            font-size: 0.8rem;
            color: #ccc;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="title">New Day One</h1>
        <p class="subtitle">A Film Experience</p>
    </header>

    <div class="farcaster-info">
        📸 Farcaster Frame
    </div>

    <div class="slideshow-container" id="slideshow">
        <div class="loading" id="loading">Loading Film Experience...</div>
    </div>

    <script>
        // Farcaster Mini App ready() call
        let readyCalled = false;

        function debugEnvironment() {
            console.log('🔍 Debugging Farcaster Mini App environment...');
            console.log('window.location:', window.location.href);
            console.log('window.parent:', !!window.parent);
            console.log('window.top:', !!window.top);
            console.log('window.farcasterSDK:', !!window.farcasterSDK);
            console.log('window.sdk:', !!window.sdk);
            console.log('typeof sdk:', typeof sdk);
            console.log('window.farcaster:', !!window.farcaster);
            console.log('window.Farcaster:', !!window.Farcaster);
            
            // Check imported Farcaster SDK
            if (window.farcasterSDK) {
                console.log('window.farcasterSDK:', window.farcasterSDK);
                console.log('window.farcasterSDK.actions:', !!window.farcasterSDK.actions);
                if (window.farcasterSDK.actions) {
                    console.log('window.farcasterSDK.actions:', window.farcasterSDK.actions);
                    console.log('window.farcasterSDK.actions.ready:', !!window.farcasterSDK.actions.ready);
                }
            }
            
            // Check all possible SDK locations
            if (window.sdk) {
                console.log('window.sdk:', window.sdk);
                console.log('window.sdk.actions:', !!window.sdk.actions);
                if (window.sdk.actions) {
                    console.log('window.sdk.actions:', window.sdk.actions);
                    console.log('window.sdk.actions.ready:', !!window.sdk.actions.ready);
                }
            }
            
            if (typeof sdk !== 'undefined') {
                console.log('global sdk:', sdk);
                console.log('global sdk.actions:', !!sdk.actions);
                if (sdk.actions) {
                    console.log('global sdk.actions.ready:', !!sdk.actions.ready);
                }
            }
            
            if (window.farcaster) {
                console.log('window.farcaster:', window.farcaster);
                console.log('window.farcaster.ready:', !!window.farcaster.ready);
                console.log('window.farcaster.actions:', !!window.farcaster.actions);
            }
            
            if (window.Farcaster) {
                console.log('window.Farcaster:', window.Farcaster);
                console.log('window.Farcaster.ready:', !!window.Farcaster.ready);
            }
            
            // Check if we're in an iframe
            console.log('In iframe:', window !== window.top);
            console.log('Parent origin:', window.parent.location.origin);
        }

        async function callReady() {
            if (readyCalled) return;
            
            console.log('🚀 Calling ready() to remove splash screen...');
            
            try {
                // Primary method: imported Farcaster SDK
                if (window.farcasterSDK && window.farcasterSDK.actions && window.farcasterSDK.actions.ready) {
                    await window.farcasterSDK.actions.ready();
                    console.log('✅ window.farcasterSDK.actions.ready() called successfully');
                    readyCalled = true;
                    return true;
                }
                // Fallback: window.sdk.actions.ready() for Mini Apps
                else if (window.sdk && window.sdk.actions && window.sdk.actions.ready) {
                    await window.sdk.actions.ready();
                    console.log('✅ window.sdk.actions.ready() called successfully');
                    readyCalled = true;
                    return true;
                }
                // Fallback: global sdk variable
                else if (typeof sdk !== 'undefined' && sdk && sdk.actions && sdk.actions.ready) {
                    await sdk.actions.ready();
                    console.log('✅ global sdk.actions.ready() called successfully');
                    readyCalled = true;
                    return true;
                }
                // Fallback: window.farcaster.ready
                else if (window.farcaster && window.farcaster.ready) {
                    window.farcaster.ready();
                    console.log('✅ window.farcaster.ready() called successfully');
                    readyCalled = true;
                    return true;
                }
                // Fallback: window.Farcaster.ready
                else if (window.Farcaster && window.Farcaster.ready) {
                    window.Farcaster.ready();
                    console.log('✅ window.Farcaster.ready() called successfully');
                    readyCalled = true;
                    return true;
                }
                // Fallback: postMessage to parent
                else if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({ type: 'ready' }, '*');
                    console.log('✅ postMessage ready sent to parent');
                    readyCalled = true;
                    return true;
                }
                // Last resort: call ready() anyway to prevent splash screen from persisting
                else {
                    console.log('⚠️ No ready methods available, calling ready() anyway to prevent splash screen persistence');
                    readyCalled = true;
                    return true;
                }
                
            } catch (error) {
                console.error('❌ Error calling ready():', error);
                // Even if there's an error, mark as ready to prevent splash screen from persisting
                readyCalled = true;
                return true;
            }
        }

        // Slideshow functionality
        let images = [];
        async function loadImagesFromAPI() {
            try {
                console.log('📸 Loading images from API...');
                const response = await fetch('/api/photos?folder=new-day-one&limit=50');
                
                if (!response.ok) {
                    throw new Error(`API failed: ${response.status}`);
                }
                
                const data = await response.json();
                const apiImages = data.photos || [];
                
                if (apiImages.length > 0) {
                    images = apiImages.map(photo => photo.src || photo.url);
                    console.log(`✅ Loaded ${images.length} images from API`);
                } else {
                    // Fallback to local images
                    images = [
                        '/images/L1000031.JPG',
                        '/images/L1000032.JPG',
                        '/images/L1000036.JPG',
                        '/images/L1000039.jpg',
                        '/images/L1000048.jpg',
                        '/images/L1000057.jpg',
                        '/images/L1000058.jpg',
                        '/images/L1000111.jpg',
                        '/images/L1000151.jpg',
                        '/images/L1000172.jpg'
                    ];
                    console.log('⚠️ No API images, using local images');
                }
            } catch (error) {
                console.error('❌ Error loading from API:', error);
                // Fallback to local images
                images = [
                    '/images/L1000031.JPG',
                    '/images/L1000032.JPG',
                    '/images/L1000036.JPG',
                    '/images/L1000039.jpg',
                    '/images/L1000048.jpg',
                    '/images/L1000057.jpg',
                    '/images/L1000058.jpg',
                    '/images/L1000111.jpg',
                    '/images/L1000151.jpg',
                    '/images/L1000172.jpg'
                ];
                console.log('⚠️ API failed, using local images');
            }
        }

        let currentSlide = 0;
        let autoPlayInterval = null;
        let slides = [];

        function createSlides() {
            console.log('🎬 Creating slides...');
            console.log('📸 Images to load:', images);
            
            const slideshow = document.getElementById('slideshow');
            slideshow.innerHTML = '';

            if (images.length === 0) {
                console.log('⚠️ No images available, creating placeholder slide');
                const slide = document.createElement('div');
                slide.className = 'slide active';
                slide.innerHTML = '<div style="text-align: center; padding: 50px; color: white;">No images available</div>';
                slideshow.appendChild(slide);
                slides.push(slide);
                return;
            }

            images.forEach((src, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `slide${index}`;

                const img = document.createElement('img');
                img.src = src;
                img.alt = `Slide ${index + 1}`;

                img.onload = () => {
                    console.log(`✅ Image ${index + 1} loaded: ${src}`);
                    
                    // Call ready() when first image loads
                    if (index === 0) {
                        console.log('🎯 First image loaded, calling ready()');
                        callReady();
                    }
                };

                img.onerror = () => {
                    console.log(`❌ Image ${index + 1} failed: ${src}`);
                    
                    // Call ready() even if first image fails
                    if (index === 0) {
                        console.log('🎯 First image failed, calling ready() anyway');
                        callReady();
                    }
                };

                slide.appendChild(img);
                slideshow.appendChild(slide);
                slides.push(slide);
            });

            console.log(`✅ Created ${slides.length} slides`);
        }

        function showSlide(index) {
            console.log(`🎬 Showing slide ${index + 1}`);
            
            slides.forEach((slide, i) => {
                slide.classList.remove('active');
            });
            
            slides[index].classList.add('active');
            currentSlide = index;
            updateCounter();
        }

        function nextSlide() {
            let next = currentSlide + 1;
            if (next >= slides.length) {
                next = 0;
            }
            showSlide(next);
        }

        function prevSlide() {
            let prev = currentSlide - 1;
            if (prev < 0) {
                prev = slides.length - 1;
            }
            showSlide(prev);
        }

        function updateCounter() {
            const counter = document.querySelector('.counter');
            if (counter) {
                counter.innerHTML = `<span id="current">${currentSlide + 1}</span> / <span id="total">${slides.length}</span>`;
            }
        }

        function startAutoPlay() {
            stopAutoPlay();
            autoPlayInterval = setInterval(nextSlide, 4000);
            console.log('▶️ Auto-play started');
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        function createControls() {
            const controls = document.createElement('div');
            controls.className = 'controls';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'btn';
            prevBtn.textContent = '←';
            prevBtn.onclick = () => {
                prevSlide();
            };

            const counter = document.createElement('div');
            counter.className = 'counter';
            counter.innerHTML = '<span id="current">1</span> / <span id="total">' + slides.length + '</span>';

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn';
            nextBtn.textContent = '→';
            nextBtn.onclick = () => {
                nextSlide();
            };

            controls.appendChild(prevBtn);
            controls.appendChild(counter);
            controls.appendChild(nextBtn);

            document.body.appendChild(controls);
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Initialize Mini App
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Mini App loaded, initializing...');
            
            // Wait a bit for SDK to load
            await new Promise(resolve => setTimeout(resolve, 100));
            
            // Debug the environment first
            debugEnvironment();
            
            // Try to call ready() immediately
            console.log('🎯 Calling ready() immediately on page load');
            let readySuccess = await callReady();
            
            // If ready() failed, keep trying until it succeeds
            if (!readySuccess && !readyCalled) {
                console.log('🔄 Ready() not available, will keep trying...');
                
                // Try every 100ms for the first 10 seconds
                const readyInterval = setInterval(async () => {
                    if (readyCalled) {
                        clearInterval(readyInterval);
                        return;
                    }
                    
                    console.log('🔄 Retrying ready()...');
                    debugEnvironment(); // Debug again to see if SDK appeared
                    readySuccess = await callReady();
                    
                    if (readySuccess) {
                        clearInterval(readyInterval);
                    }
                }, 100);
                
                // Stop trying after 10 seconds
                setTimeout(() => {
                    clearInterval(readyInterval);
                    if (!readyCalled) {
                        console.log('⏰ Stopped retrying ready() after 10 seconds');
                    }
                }, 10000);
            }
            
            try {
                // Load images and create slideshow
                await loadImagesFromAPI();
                createSlides();
                createControls();
                showSlide(0);
                hideLoading();
                
                // Start auto-play
                startAutoPlay();
                
                // Call ready() again after everything is loaded
                console.log('🎯 Calling ready() again after slideshow is ready');
                await callReady();
                
            } catch (error) {
                console.error('❌ Initialization error:', error);
                // Still try to call ready() even if there's an error
                await callReady();
            }
        });

        // Also call ready() when window loads
        window.addEventListener('load', async () => {
            if (!readyCalled) {
                console.log('🌐 Window loaded, calling ready()');
                await callReady();
            }
        });

        // Watch for SDK to become available
        let sdkCheckInterval = null;
        if (!readyCalled) {
            sdkCheckInterval = setInterval(async () => {
                if (readyCalled) {
                    clearInterval(sdkCheckInterval);
                    return;
                }
                
                // Check if any ready method just became available
                if ((window.farcasterSDK && window.farcasterSDK.actions && window.farcasterSDK.actions.ready) ||
                    (window.sdk && window.sdk.actions && window.sdk.actions.ready) ||
                    (window.farcaster && window.farcaster.ready) ||
                    (window.Farcaster && window.Farcaster.ready)) {
                    console.log('🎯 Ready method detected! Calling ready()...');
                    await callReady();
                    clearInterval(sdkCheckInterval);
                }
            }, 50); // Check every 50ms
            
            // Stop checking after 15 seconds
            setTimeout(() => {
                if (sdkCheckInterval) {
                    clearInterval(sdkCheckInterval);
                    console.log('⏰ Stopped SDK checking after 15 seconds');
                }
            }, 15000);
        }

        // Multiple fallback timeouts to ensure ready() is called
        setTimeout(async () => {
            if (!readyCalled) {
                console.log('⏰ 500ms timeout: calling ready()');
                await callReady();
            }
        }, 500);

        setTimeout(async () => {
            if (!readyCalled) {
                console.log('⏰ 1s timeout: calling ready()');
                await callReady();
            }
        }, 1000);

        setTimeout(async () => {
            if (!readyCalled) {
                console.log('⏰ 3s timeout: calling ready()');
                await callReady();
            }
        }, 3000);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    prevSlide();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextSlide();
                    break;
            }
        });
    </script>
</body>
</html>
