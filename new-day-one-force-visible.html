<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Day One - Force Visible</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .slideshow {
            position: relative;
            width: 100%;
            height: 400px;
            border: 3px solid #333;
            margin: 20px 0;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #ddd;
        }

        .slide.active {
            display: block !important;
        }

        .slide img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #555;
        }

        .counter {
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .debug {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            border-left: 4px solid #333;
        }

        .debug h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .debug p {
            margin: 5px 0;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>New Day One - Force Visible</h1>
        
        <div class="debug">
            <h3>Debug Info:</h3>
            <p id="debugInfo">Loading...</p>
        </div>
        
        <div class="slideshow" id="slideshow">
            <div class="slide active" id="slide0">
                <img src="/images/724-10.JPG" alt="Slide 1" onload="imageLoaded(0)" onerror="imageError(0)">
            </div>
            <div class="slide" id="slide1">
                <img src="/images/724-56.JPG" alt="Slide 2" onload="imageLoaded(1)" onerror="imageError(1)">
            </div>
            <div class="slide" id="slide2">
                <img src="/images/724-62.JPG" alt="Slide 3" onload="imageLoaded(2)" onerror="imageError(2)">
            </div>
            <div class="slide" id="slide3">
                <img src="/images/724-70.JPG" alt="Slide 4" onload="imageLoaded(3)" onerror="imageError(3)">
            </div>
            <div class="slide" id="slide4">
                <img src="/images/84190002.JPG" alt="Slide 5" onload="imageLoaded(4)" onerror="imageError(4)">
            </div>
            <div class="slide" id="slide5">
                <img src="/images/84190003.JPG" alt="Slide 6" onload="imageLoaded(5)" onerror="imageError(5)">
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="prevSlide()">← Previous</button>
            <button class="btn" onclick="togglePlay()" id="playBtn">⏸ Pause</button>
            <button class="btn" onclick="nextSlide()">Next →</button>
        </div>
        
        <div class="counter">
            <span id="currentSlide">1</span> / <span id="totalSlides">6</span>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        let totalSlides = 6;
        let autoPlayInterval = null;
        let imageStatus = [];
        
        function updateDebug() {
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.innerHTML = `
                Current slide: ${currentSlide + 1}<br>
                Auto-play: ${autoPlayInterval ? 'ON' : 'OFF'}<br>
                Image status: ${imageStatus.join(', ')}<br>
                Slide visibility: ${document.getElementById('slide' + currentSlide).style.display}<br>
                Image src: ${document.querySelector('#slide' + currentSlide + ' img').src}<br>
                Image naturalWidth: ${document.querySelector('#slide' + currentSlide + ' img').naturalWidth}<br>
                Image naturalHeight: ${document.querySelector('#slide' + currentSlide + ' img').naturalHeight}
            `;
        }
        
        function imageLoaded(index) {
            imageStatus[index] = 'LOADED';
            console.log(`Image ${index + 1} loaded successfully`);
            updateDebug();
        }
        
        function imageError(index) {
            imageStatus[index] = 'ERROR';
            console.error(`Image ${index + 1} failed to load`);
            updateDebug();
        }
        
        function showSlide(index) {
            console.log(`Showing slide ${index + 1}`);
            
            // Hide all slides
            for (let i = 0; i < totalSlides; i++) {
                document.getElementById('slide' + i).classList.remove('active');
            }
            
            // Show current slide
            document.getElementById('slide' + index).classList.add('active');
            
            currentSlide = index;
            document.getElementById('currentSlide').textContent = index + 1;
            
            updateDebug();
        }
        
        function nextSlide() {
            let next = currentSlide + 1;
            if (next >= totalSlides) {
                next = 0;
            }
            showSlide(next);
        }
        
        function prevSlide() {
            let prev = currentSlide - 1;
            if (prev < 0) {
                prev = totalSlides - 1;
            }
            showSlide(prev);
        }
        
        function startAutoPlay() {
            stopAutoPlay();
            autoPlayInterval = setInterval(nextSlide, 3000);
            document.getElementById('playBtn').textContent = '⏸ Pause';
            updateDebug();
        }
        
        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
            document.getElementById('playBtn').textContent = '▶ Play';
            updateDebug();
        }
        
        function togglePlay() {
            if (autoPlayInterval) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, initializing slideshow...');
            showSlide(0);
            startAutoPlay();
            
            // Check image status after a delay
            setTimeout(() => {
                for (let i = 0; i < totalSlides; i++) {
                    const img = document.querySelector('#slide' + i + ' img');
                    if (img.complete) {
                        if (img.naturalWidth > 0) {
                            imageStatus[i] = 'LOADED';
                        } else {
                            imageStatus[i] = 'ERROR';
                        }
                    } else {
                        imageStatus[i] = 'LOADING';
                    }
                }
                updateDebug();
            }, 1000);
        });
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    stopAutoPlay();
                    prevSlide();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    stopAutoPlay();
                    nextSlide();
                    break;
                case ' ':
                    e.preventDefault();
                    togglePlay();
                    break;
            }
        });
    </script>
</body>
</html>
