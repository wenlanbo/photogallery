<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Day One - Working Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', sans-serif;
            line-height: 1.5;
            color: #1a1a1a;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: #fafafa;
            padding: 2.5rem 0;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 500;
            color: #0f0f0f;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666666;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .main {
            padding: 2rem 0;
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-deck {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            opacity: 0;
            transform: translateX(100%) rotateY(10deg);
        }

        .card.active {
            opacity: 1;
            transform: translateX(0) rotateY(0deg);
            z-index: 10;
        }

        .card.prev {
            opacity: 0.3;
            transform: translateX(-100%) rotateY(-10deg);
            z-index: 5;
        }

        .card.next {
            opacity: 0.3;
            transform: translateX(100%) rotateY(10deg);
            z-index: 5;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.02);
        }

        .navigation {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 2rem;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .nav-btn {
            background: #0f0f0f;
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #333333;
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .counter {
            font-size: 0.9rem;
            color: #666666;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            min-width: 80px;
            text-align: center;
        }

        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            color: #666666;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 1);
            color: #0f0f0f;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #0f0f0f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
            padding: 1.5rem 0;
            text-align: center;
            margin-top: auto;
        }

        .copyright {
            font-size: 0.85rem;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="title">New Day One</h1>
            <p class="subtitle">A Film Experience - Working Version</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="card-deck" id="cardDeck">
                <!-- Cards will be created here -->
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading Film Experience...</p>
            </div>
        </div>
    </main>

    <!-- Navigation controls -->
    <div class="navigation" id="navigation">
        <button class="nav-btn prev-btn" id="prevBtn">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="counter" id="counter">
            <span id="currentIndex">1</span> / <span id="totalCount">0</span>
        </div>
        <button class="nav-btn next-btn" id="nextBtn">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <!-- Back to main gallery -->
    <div class="back-link">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Gallery</span>
        </a>
    </div>

    <!-- Footer with copyright -->
    <footer class="footer">
        <div class="container">
            <p class="copyright">© 2024 Wenlanbo. All rights reserved.</p>
        </div>
    </footer>

    <script>
        class WorkingCardDeck {
            constructor() {
                this.currentIndex = 0;
                this.photos = [];
                
                // DOM elements
                this.cardDeck = document.getElementById('cardDeck');
                this.loading = document.getElementById('loading');
                this.navigation = document.getElementById('navigation');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.currentIndexSpan = document.getElementById('currentIndex');
                this.totalCountSpan = document.getElementById('totalCount');
                
                this.init();
            }
            
            async init() {
                await this.loadPhotos();
                this.setupEventListeners();
                this.showCurrentCard();
            }
            
            async loadPhotos() {
                try {
                    console.log('Loading photos...');
                    const response = await fetch('/api/photos?folder=new-day-one&limit=100');
                    const data = await response.json();
                    
                    this.photos = data.photos || [];
                    console.log('Photos loaded:', this.photos.length);
                    
                    if (this.photos.length === 0) {
                        // Use fallback photos
                        this.photos = [
                            { src: '/images/724-10.JPG', alt: 'Fallback 1' },
                            { src: '/images/724-56.JPG', alt: 'Fallback 2' },
                            { src: '/images/724-62.JPG', alt: 'Fallback 3' },
                            { src: '/images/724-70.JPG', alt: 'Fallback 4' },
                            { src: '/images/84190002.JPG', alt: 'Fallback 5' },
                            { src: '/images/84190003.JPG', alt: 'Fallback 6' }
                        ];
                    }
                    
                    this.createCards();
                    this.hideLoading();
                    
                } catch (error) {
                    console.error('Error loading photos:', error);
                    this.loadFallbackPhotos();
                }
            }
            
            loadFallbackPhotos() {
                this.photos = [
                    { src: '/images/724-10.JPG', alt: 'Fallback 1' },
                    { src: '/images/724-56.JPG', alt: 'Fallback 2' },
                    { src: '/images/724-62.JPG', alt: 'Fallback 3' },
                    { src: '/images/724-70.JPG', alt: 'Fallback 4' },
                    { src: '/images/84190002.JPG', alt: 'Fallback 5' },
                    { src: '/images/84190003.JPG', alt: 'Fallback 6' }
                ];
                this.createCards();
                this.hideLoading();
            }
            
            createCards() {
                this.cardDeck.innerHTML = '';
                
                this.photos.forEach((photo, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.index = index;
                    
                    const img = document.createElement('img');
                    img.src = photo.src || photo.url;
                    img.alt = photo.alt || `Photo ${index + 1}`;
                    img.loading = 'lazy';
                    
                    card.appendChild(img);
                    this.cardDeck.appendChild(card);
                    
                    console.log(`Created card ${index + 1}:`, img.src);
                });
                
                this.totalCountSpan.textContent = this.photos.length;
            }
            
            showCurrentCard() {
                const cards = this.cardDeck.querySelectorAll('.card');
                
                cards.forEach((card, index) => {
                    card.classList.remove('active', 'prev', 'next');
                    
                    if (index === this.currentIndex) {
                        card.classList.add('active');
                    } else if (index === this.currentIndex - 1) {
                        card.classList.add('prev');
                    } else if (index === this.currentIndex + 1) {
                        card.classList.add('next');
                    }
                });
                
                this.currentIndexSpan.textContent = this.currentIndex + 1;
                this.updateNavigation();
            }
            
            nextCard() {
                if (this.currentIndex < this.photos.length - 1) {
                    this.currentIndex++;
                    this.showCurrentCard();
                }
            }
            
            prevCard() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.showCurrentCard();
                }
            }
            
            updateNavigation() {
                this.prevBtn.disabled = this.currentIndex === 0;
                this.nextBtn.disabled = this.currentIndex === this.photos.length - 1;
            }
            
            setupEventListeners() {
                this.prevBtn.addEventListener('click', () => this.prevCard());
                this.nextBtn.addEventListener('click', () => this.nextCard());
                
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.prevCard();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.nextCard();
                            break;
                    }
                });
                
                this.cardDeck.addEventListener('click', (e) => {
                    if (e.target.closest('.card')) {
                        this.nextCard();
                    }
                });
            }
            
            hideLoading() {
                this.loading.style.display = 'none';
                this.navigation.style.display = 'flex';
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new WorkingCardDeck();
        });
    </script>
</body>
</html>
