<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Day One - Simple Debug</title>
    <link rel="stylesheet" href="new-day-one.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Override for simple debug version */
        .card {
            position: relative !important;
            margin: 10px 0 !important;
            opacity: 1 !important;
            transform: none !important;
            z-index: 1 !important;
        }
        
        .card-deck {
            height: auto !important;
            min-height: 600px;
        }
        
        .card img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="title">New Day One</h1>
            <p class="subtitle">Simple Debug Version</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="card-deck" id="cardDeck">
                <!-- Cards will be created here -->
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading Photos...</p>
            </div>
        </div>
    </main>

    <!-- Navigation controls -->
    <div class="navigation" id="navigation">
        <button class="nav-btn prev-btn" id="prevBtn">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="counter" id="counter">
            <span id="currentIndex">1</span> / <span id="totalCount">0</span>
        </div>
        <button class="nav-btn next-btn" id="nextBtn">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <!-- Back to main gallery -->
    <div class="back-link">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Gallery</span>
        </a>
    </div>

    <script>
        // Simple debug version
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Simple debug version loaded');
            
            const cardDeck = document.getElementById('cardDeck');
            const loading = document.getElementById('loading');
            const navigation = document.getElementById('navigation');
            const totalCount = document.getElementById('totalCount');
            
            try {
                // Load photos from API
                console.log('Loading photos from API...');
                const response = await fetch('/api/photos?folder=new-day-one&limit=100');
                const data = await response.json();
                
                console.log('API Response:', data);
                
                const photos = data.photos || [];
                console.log('Photos loaded:', photos.length);
                
                if (photos.length === 0) {
                    // Try fallback
                    console.log('No photos from API, using fallback...');
                    const fallbackPhotos = [
                        { src: '/images/724-10.JPG', alt: 'Fallback 1' },
                        { src: '/images/724-56.JPG', alt: 'Fallback 2' },
                        { src: '/images/724-62.JPG', alt: 'Fallback 3' }
                    ];
                    
                    photos.push(...fallbackPhotos);
                }
                
                // Create cards
                photos.forEach((photo, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.border = '2px solid red';
                    card.style.padding = '10px';
                    card.style.margin = '10px 0';
                    
                    const img = document.createElement('img');
                    img.src = photo.src || photo.url;
                    img.alt = photo.alt || `Photo ${index + 1}`;
                    img.style.maxWidth = '100%';
                    img.style.height = 'auto';
                    img.style.maxHeight = '400px';
                    
                    const label = document.createElement('p');
                    label.textContent = `Card ${index + 1}: ${img.src}`;
                    label.style.margin = '10px 0';
                    label.style.fontWeight = 'bold';
                    
                    card.appendChild(label);
                    card.appendChild(img);
                    cardDeck.appendChild(card);
                    
                    console.log(`Created card ${index + 1}:`, img.src);
                });
                
                // Hide loading, show navigation
                loading.style.display = 'none';
                navigation.style.display = 'flex';
                totalCount.textContent = photos.length;
                
                console.log('Simple debug setup complete');
                
            } catch (error) {
                console.error('Error in simple debug version:', error);
                loading.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
